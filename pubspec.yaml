name: koins_savings_app
description: A simple savings application for Koins MFB - Flutter Developer Technical Assessment.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Local Storage
  shared_preferences: ^2.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking
  http: ^1.2.2
  dio: ^5.7.0

  # Utils
  intl: ^0.19.0
  equatable: ^2.0.5
  logger: ^2.4.0
  go_router: ^17.5.0
  sqflite: ^2.4.4+2
  path: ^1.9.1
  sqflite_common_ffi: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/ui_reference/
